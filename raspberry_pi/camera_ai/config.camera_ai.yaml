camera:
  device: "auto"
  model: "BUFFALO BSW500M"
  preferred_usb_vendor_id: "0411"
  preferred_usb_product_id: "02da"
  backend: "v4l2"
  width: 320
  height: 240
  fps: 5
  fourcc: "MJPG"
  read_retries: 3
  retry_delay_sec: 0.1

inference:
  model_path: "models/yolo_bear_ncnn_model"
  fallback_model_paths:
    - "models/yolo_bear_int8.tflite"
    - "models/yolo_bear.onnx"
    - "models/yolo_bear.pt"
  input_size: 256
  confidence_floor: 0.05
  device: "cpu"
  class_ids: []
  inference_interval_sec: 2.0
  use_display: false

approach_detection:
  target_classes:
    - "bear"
  confidence_threshold: 0.50
  approach_area_ratio_threshold: 0.12
  consecutive_required: 3
  max_detection_age_sec: 2.0

output:
  jsonl_stdout: true
  save_csv: true
  csv_path: "data/logs/camera_ai_log.csv"
  save_debug_frames: true
  debug_frame_dir: "data/debug_frames"
  latest_debug_frame: "latest_camera_ai.jpg"
  debug_frame_interval_sec: 0.2

fail_safe:
  default_ai_bear_detected: false
  dark_frame_mean_threshold: 30.0
  dark_frame_recovery_sec: 3.0
  camera_reopen_delay_sec: 1.0
  max_consecutive_read_failures: 3
